[project]
name = "tangram"
version = "0"
description = "A personal agent on Claude Code: the Signal listener, the scheduler, email and Total Recall."
# Exactly the Python and packages the agent runs on, owned by uv and nothing
# else on the laptop: another Python install updating or breaking must not take
# the agent with it. uv.lock records the same versions with hashes.
# Build: uv sync, in this folder.
requires-python = "==3.11.17"
dependencies = [
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.5.0",
    "fastembed==0.8.0",
    "filelock==4.0.1",
    "flatbuffers==25.12.19",
    "fsspec==2026.9.0",
    "h11==0.16.0",
    "hf-xet==1.6.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface_hub==1.32.0",
    "idna==3.20",
    "loguru==0.7.3",
    "mmh3==5.3.0",
    "numpy==2.4.6",
    "onnxruntime==1.30.0",
    "packaging==26.3",
    "pillow==12.3.0",
    "protobuf==7.36.2",
    "py_rust_stemmers==0.1.8",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "tokenizers==0.23.2",
    "tqdm==4.70.1",
    "typing_extensions==4.16.0",
    "urllib3==2.8.0",
]

[tool.uv]
python-preference = "only-managed"
package = false
